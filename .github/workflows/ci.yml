name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://metastratum:metastratum@localhost:5432/metastratum

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: metastratum
          POSTGRES_PASSWORD: metastratum
          POSTGRES_DB: metastratum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metastratum" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libvirt-clients qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The agent ships as a static binary.
      - run: cargo build --release -p mst-agent --target x86_64-unknown-linux-musl

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The typed API client must match the controller's OpenAPI document.
      - run: npm run api && git diff --exit-code -- src/api/schema.d.ts
        working-directory: web
      - run: npm run typecheck && npm test && npx vite build
        working-directory: web
