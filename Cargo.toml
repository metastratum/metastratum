[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metastratum/metastratum"
rust-version = "1.97"

[workspace.dependencies]
mst-authz = { path = "crates/mst-authz" }
mst-core = { path = "crates/mst-core" }
mst-db = { path = "crates/mst-db" }
mst-libvirt = { path = "crates/mst-libvirt" }
mst-ovsdb = { path = "crates/mst-ovsdb" }
mst-netplan = { path = "crates/mst-netplan" }
mst-pki = { path = "crates/mst-pki" }
mst-proto = { path = "crates/mst-proto" }
mst-scheduler = { path = "crates/mst-scheduler" }
mst-storage = { path = "crates/mst-storage" }
mst-virtrpc = { path = "crates/mst-virtrpc" }

anyhow = "1"
async-stream = "0.3"
base64 = "0.23"
futures = "0.3"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
prost = "0.14"
quick-xml = "0.42"
rand = "0.10"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
# TLS via the process-wide rustls provider (ring), so only one crypto library is linked.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
x509-parser = "0.18"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Symbols stay, for readable backtraces; debug info goes.
strip = "debuginfo"
