# Local development dependencies.
#   docker compose -f deploy/dev/compose.yaml up -d
#   export DATABASE_URL=postgres://metastratum:metastratum@127.0.0.1:55432/metastratum
name: metastratum
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: metastratum
      POSTGRES_PASSWORD: metastratum
      POSTGRES_DB: metastratum
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  # Shared rate limits between controller replicas (api.redis_url =
  # redis://127.0.0.1:56379).
  redis:
    image: redis:8.2
    ports:
      - "127.0.0.1:56379:6379"
  # Identity provider for OIDC sign-in (see dex.yaml).
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
volumes:
  pgdata:
