# cloudbase-init while sysprep specializes a new VM (before its first boot
# proper): the hostname, so no reboot is needed for it later, and the user
# data, so the VM's account is there (with its password) before the
# welcome screens. The service skips both after.
[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
        cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
        cloudbaseinit.plugins.common.userdata.UserDataPlugin
netbios_host_name_compatibility=true
allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
mtu_use_dhcp_config=true

[config_drive]
types=iso,vfat
locations=cdrom,hdd,partition
