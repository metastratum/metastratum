# cloudbase-init for metastratum VMs (build.sh): the VM's cloud-init seed
# (NoCloud, a disc labelled cidata) gives the hostname, and user data whose
# cloud-config sets the VM's account's password on the first boot (making
# the account, an administrator, if it is not there). No random password
# is set: a VM made without a password keeps the image's (unknown to
# anyone).
[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
        cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
        cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,
        cloudbaseinit.plugins.common.userdata.UserDataPlugin,
        cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin
netbios_host_name_compatibility=true
allow_reboot=true
stop_service_on_exit=false
check_latest_version=false
san_policy=OnlineAll
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
mtu_use_dhcp_config=true
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

[config_drive]
types=iso,vfat
locations=cdrom,hdd,partition
