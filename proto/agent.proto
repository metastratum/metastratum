// Protocol between hm-controller and hm-agent.
//
// Agents always dial the controller. `Enrollment` is served with server-only
// TLS (the agent pins the CA from its join token); `AgentControl` requires the
// client certificate issued during enrollment.
syntax = "proto3";

package hypermon.agent.v1;

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// Between controller replicas: an agent holds its session with one replica;
// the others forward commands and console tunnels for its host to it. Only
// replica certificates are accepted.
service ReplicaControl {
  rpc Call(ForwardedCommand) returns (CommandResult);
  // Metadata names the console: host-id, vm-id, kind ("vnc" or "serial").
  rpc Console(stream TunnelChunk) returns (stream TunnelChunk);
}

message ForwardedCommand {
  string host_id = 1;
  Command command = 2;
  uint64 timeout_ms = 3;
}

service AgentControl {
  // Long-lived control stream. The first agent message must be `hello`.
  rpc Session(stream AgentMessage) returns (stream ControllerMessage);
  // Reverse tunnel for a console session, dialled by the agent after it
  // receives `OpenConsole`. The first chunk carries the session ID.
  rpc ConsoleTunnel(stream TunnelChunk) returns (stream TunnelChunk);
}

message EnrollRequest {
  string token = 1;
  // PEM-encoded PKCS#10 certificate signing request.
  string csr_pem = 2;
  HostFacts facts = 3;
}

message EnrollResponse {
  string host_id = 1;
  string cert_pem = 2;
  string ca_pem = 3;
}

message HostFacts {
  string hostname = 1;
  // Address other hosts and the controller use to reach this host.
  string address = 2;
  uint32 cpu_count = 3;
  uint64 memory_mib = 4;
  string cpu_model = 5;
  bool kvm = 6;
  string libvirt_version = 7;
  string ovn_chassis = 8;
  string agent_version = 9;
  // Physical networks OVS bridges reach (names from ovn-bridge-mappings).
  repeated string physical_networks = 10;
  // The host-model CPU (`hm_core::vm::CpuSpec` as JSON), for cluster
  // baselines; empty if unknown.
  string cpu_json = 11;
  // Whether libvirt accepts TLS connections from other hosts, which live
  // migration to this host needs.
  bool migration_ready = 12;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult result = 3;
    DomainState domain_state = 4;
  }
}

message Hello {
  HostFacts facts = 1;
  repeated DomainState domains = 2;
}

message Heartbeat {
  repeated DomainState domains = 1;
  // True when `domains` lists every managed domain on the host. Changes are
  // pushed as `DomainState` the moment libvirt reports them; full lists are a
  // periodic safety net.
  bool complete = 2;
}

// Observed state of a hypermon-managed libvirt domain.
message DomainState {
  string vm_id = 1;
  uint64 generation = 2;
  PowerState power = 3;
  // Why a stopped or crashed domain stopped, when libvirt knows: shutdown,
  // destroyed, crashed, migrated, saved, failed, from_snapshot or daemon.
  // Empty otherwise.
  string reason = 4;
}

enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_STATE_RUNNING = 1;
  POWER_STATE_STOPPED = 2;
  POWER_STATE_PAUSED = 3;
  POWER_STATE_CRASHED = 4;
  POWER_STATE_SHUTTING_DOWN = 5;
}

message ControllerMessage {
  oneof msg {
    Command command = 1;
  }
}

message Command {
  string request_id = 1;
  oneof cmd {
    EnsureImage ensure_image = 10;
    EnsureVolume ensure_volume = 11;
    DeleteVolume delete_volume = 12;
    DefineVm define_vm = 13;
    StartVm start_vm = 14;
    StopVm stop_vm = 15;
    RebootVm reboot_vm = 16;
    UndefineVm undefine_vm = 17;
    OpenConsole open_console = 18;
    BaselineCpu baseline_cpu = 19;
    PrepareMigration prepare_migration = 20;
    MigrateVm migrate_vm = 21;
    MigrationStats migration_stats = 22;
    AbortMigration abort_migration = 23;
    DomainInfo domain_info = 24;
  }
}

message CommandResult {
  string request_id = 1;
  // Empty on success.
  string error = 2;
  // What a query returns (JSON), on success.
  string payload = 3;
}

// A storage pool, as much as the agent needs to reach it.
message Pool {
  string id = 1;
  // "local", "nfs" or "rbd".
  string kind = 2;
  // Kind-specific connection details (JSON), including secrets.
  string config_json = 3;
}

// Make an image available in a pool (download and convert it once).
message EnsureImage {
  string image_id = 1;
  string source_url = 2;
  // "qcow2" or "raw": the format of the downloaded file.
  string format = 3;
  Pool pool = 4;
  // Published by the provider: may come from internal (non-public)
  // addresses. Tenants' images are only fetched from public ones.
  bool trusted = 5;
}

// Create a volume, optionally as a copy-on-write clone of an image in the
// same pool.
message EnsureVolume {
  string volume_id = 1;
  uint64 size_bytes = 2;
  string image_id = 3;
  Pool pool = 4;
}

message DeleteVolume {
  string volume_id = 1;
  Pool pool = 2;
}

// Define (or redefine) the domain for a VM. `spec_json` is an
// `hm_core::vm::VmSpec`; shared Rust types avoid duplicating the schema here.
message DefineVm {
  string vm_id = 1;
  string tenant_id = 2;
  string name = 3;
  uint64 generation = 4;
  string spec_json = 5;
  // Pools the VM's disks live in.
  repeated Pool pools = 6;
}

message StartVm {
  string vm_id = 1;
}

message StopVm {
  string vm_id = 1;
  // Pull the plug instead of an ACPI shutdown.
  bool force = 2;
}

message RebootVm {
  string vm_id = 1;
}

// Destroy and undefine the domain and remove its per-VM files. Volumes are
// deleted separately.
message UndefineVm {
  string vm_id = 1;
}

// The CPU model all of `cpus_json` (each an `hm_core::vm::CpuSpec`) can run,
// keeping only features that survive migration. Returns a CpuSpec.
message BaselineCpu {
  repeated string cpus_json = 1;
}

// On a migration's destination: set up what the VM needs besides its
// volumes (storage pools, Ceph secrets, the cloud-init seed), without
// defining the domain; the migration brings that.
message PrepareMigration {
  DefineVm vm = 1;
}

// On a migration's source: live-migrate the running VM to the host at
// `dest_address`. Returns when done (or failed, the VM still running here).
message MigrateVm {
  string vm_id = 1;
  string dest_address = 2;
  // Disks on host-local storage to copy (targets: vda, ...).
  repeated string copy_disks = 3;
}

// Progress of the VM's migration job. Returns hm_libvirt::JobStats as JSON.
message MigrationStats {
  string vm_id = 1;
}

message AbortMigration {
  string vm_id = 1;
}

// Whether the VM's domain is here and in what state. Returns
// {"defined": bool, "power": "...", "job_active": bool}.
message DomainInfo {
  string vm_id = 1;
}

enum ConsoleKind {
  CONSOLE_KIND_UNSPECIFIED = 0;
  CONSOLE_KIND_VNC = 1;
  CONSOLE_KIND_SERIAL = 2;
}

message OpenConsole {
  string session_id = 1;
  string vm_id = 2;
  ConsoleKind kind = 3;
}

message TunnelChunk {
  oneof msg {
    string session_id = 1;
    bytes data = 2;
  }
}
