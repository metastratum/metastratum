// Protocol between mst-controller and mst-agent.
//
// Agents always dial the controller. `Enrollment` is served with server-only
// TLS (the agent pins the CA from its join token); `AgentControl` requires the
// client certificate issued during enrollment.
syntax = "proto3";

package metastratum.agent.v1;

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// Between controller replicas: an agent holds its session with one replica;
// the others forward commands and console tunnels for its host to it. Only
// replica certificates are accepted.
service ReplicaControl {
  rpc Call(ForwardedCommand) returns (CommandResult);
  // Metadata names the console: host-id, vm-id, kind ("vnc" or "serial").
  rpc Console(stream TunnelChunk) returns (stream TunnelChunk);
}

message RenewRequest {
  string csr_pem = 1;
}

message RenewResponse {
  string cert_pem = 1;
}

message ForwardedCommand {
  string host_id = 1;
  Command command = 2;
  uint64 timeout_ms = 3;
}

service AgentControl {
  // Long-lived control stream. The first agent message must be `hello`.
  rpc Session(stream AgentMessage) returns (stream ControllerMessage);
  // Reverse tunnel for a console session, dialled by the agent after it
  // receives `OpenConsole`. The first chunk carries the session ID.
  rpc ConsoleTunnel(stream TunnelChunk) returns (stream TunnelChunk);
  // Swaps the host's certificate for a new one (new key), before the old
  // expires. Authenticated by the current certificate.
  rpc Renew(RenewRequest) returns (RenewResponse);
  // A certificate for the host's ovn-controller to reach the OVN southbound
  // database, from the controller's OVN CA, naming the host's chassis (for
  // OVN's RBAC). Only when the controller manages southbound access (its
  // Welcome names the remote).
  rpc OvnCredentials(OvnCredentialsRequest) returns (OvnCredentialsResponse);
}

message OvnCredentialsRequest {
  string csr_pem = 1;
}

message OvnCredentialsResponse {
  string cert_pem = 1;
  // The CA the southbound servers' certificates chain to.
  string ca_pem = 2;
}

message EnrollRequest {
  string token = 1;
  // PEM-encoded PKCS#10 certificate signing request.
  string csr_pem = 2;
  HostFacts facts = 3;
}

message EnrollResponse {
  string host_id = 1;
  string cert_pem = 2;
  string ca_pem = 3;
}

message HostFacts {
  string hostname = 1;
  // Address other hosts and the controller use to reach this host.
  string address = 2;
  uint32 cpu_count = 3;
  uint64 memory_mib = 4;
  string cpu_model = 5;
  bool kvm = 6;
  string libvirt_version = 7;
  string ovn_chassis = 8;
  string agent_version = 9;
  // Physical networks OVS bridges reach (names from ovn-bridge-mappings).
  repeated string physical_networks = 10;
  // The host-model CPU (`mst_core::vm::CpuSpec` as JSON), for cluster
  // baselines; empty if unknown.
  string cpu_json = 11;
  // Whether live migrations can involve this host: QEMU runs in a group
  // the agent can give a migration's TLS key to.
  bool migration_ready = 12;
  // Whether guests can have a TPM 2.0 here (libvirt runs swtpm).
  bool tpm = 13;
  // Whether guests can have UEFI Secure Boot here (firmware with it).
  bool secure_boot = 14;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult result = 3;
    DomainState domain_state = 4;
  }
}

message Hello {
  HostFacts facts = 1;
  repeated DomainState domains = 2;
  // The protocol revision the agent speaks (0: from before versioning).
  uint32 protocol_version = 3;
  // Commands it handles, by name (see mst_proto::capability).
  repeated string capabilities = 4;
}

message Heartbeat {
  repeated DomainState domains = 1;
  // True when `domains` lists every managed domain on the host. Changes are
  // pushed as `DomainState` the moment libvirt reports them; full lists are a
  // periodic safety net.
  bool complete = 2;
}

// Observed state of a metastratum-managed libvirt domain.
message DomainState {
  string vm_id = 1;
  uint64 generation = 2;
  PowerState power = 3;
  // Why a stopped or crashed domain stopped, when libvirt knows: shutdown,
  // destroyed, crashed, migrated, saved, failed, from_snapshot or daemon.
  // Empty otherwise.
  string reason = 4;
}

enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_STATE_RUNNING = 1;
  POWER_STATE_STOPPED = 2;
  POWER_STATE_PAUSED = 3;
  POWER_STATE_CRASHED = 4;
  POWER_STATE_SHUTTING_DOWN = 5;
}

message ControllerMessage {
  oneof msg {
    Command command = 1;
    Welcome welcome = 2;
  }
}

// The controller's first message on a session.
message Welcome {
  uint32 protocol_version = 1;
  string controller_version = 2;
  // OVN southbound remote(s) for ovn-controller, over TLS (ssl:...); empty
  // when the controller leaves southbound access to the deployment.
  string ovn_sb_remote = 3;
  reserved 4;
  // What exists, so the agent lets go of the rest: pools deleted and images
  // deleted while it was away.
  Inventory inventory = 5;
}

message Inventory {
  repeated string pool_ids = 1;
  repeated string image_ids = 2;
}

message Command {
  string request_id = 1;
  oneof cmd {
    EnsureVolume ensure_volume = 11;
    DeleteVolume delete_volume = 12;
    DefineVm define_vm = 13;
    StartVm start_vm = 14;
    StopVm stop_vm = 15;
    RebootVm reboot_vm = 16;
    UndefineVm undefine_vm = 17;
    OpenConsole open_console = 18;
    BaselineCpu baseline_cpu = 19;
    PrepareMigration prepare_migration = 20;
    MigrationStats migration_stats = 22;
    AbortMigration abort_migration = 23;
    DomainInfo domain_info = 24;
    RenewCertificate renew_certificate = 25;
    MigrationStep migration_step = 26;
    SetDiskLimits set_disk_limits = 29;
    RemovePool remove_pool = 30;
    DeleteImage delete_image = 31;
    Decommission decommission = 32;
    BackupVm backup_vm = 33;
    RestoreVolume restore_volume = 34;
    DeleteBackup delete_backup = 35;
    SnapshotVm snapshot_vm = 36;
    RevertSnapshot revert_snapshot = 37;
    DeleteSnapshot delete_snapshot = 38;
    ResizeDisk resize_disk = 39;
    CloneVolume clone_volume = 40;
    SetMemory set_memory = 41;
    MemoryStats memory_stats = 42;
    SetVcpus set_vcpus = 43;
    AttachDisk attach_disk = 44;
    DetachDisk detach_disk = 45;
    ExportVolume export_volume = 46;
    EndExport end_export = 47;
    CopyVolume copy_volume = 48;
    ExportImage export_image = 50;
    CopyImage copy_image = 51;
    VolumeFromImage volume_from_image = 52;
    PruneStore prune_store = 53;
    GuestFileExists guest_file_exists = 54;
    AttachNic attach_nic = 55;
    DetachNic detach_nic = 56;
    ReplugNic replug_nic = 57;
    ExportTpm export_tpm = 58;
    ImportTpm import_tpm = 59;
    ReceiveImage receive_image = 60;
    StoreImage store_image = 61;
  }
  // 10: EnsureImage, before the image store. 21: MigrateVm, peer to peer.
  // 27: LibvirtTls, which opened libvirt to other hosts for that. 28:
  // InstallCrl, for QEMU trusting the controller's CA.
  // 49: FetchImage (hosts downloaded images; the controller does now).
  reserved 10, 21, 27, 28, 49;
}

message CommandResult {
  string request_id = 1;
  // Empty on success.
  string error = 2;
  // What a query returns (JSON), on success.
  string payload = 3;
}

// A storage pool, as much as the agent needs to reach it.
message Pool {
  string id = 1;
  // "local", "nfs" or "rbd".
  string kind = 2;
  // Kind-specific connection details (JSON), including secrets.
  string config_json = 3;
}

// Create a blank volume. An existing volume is left alone.
message EnsureVolume {
  string volume_id = 1;
  uint64 size_bytes = 2;
  Pool pool = 4;
  // 3: an image to put it on, before the image store.
  reserved 3;
}

message DeleteVolume {
  string volume_id = 1;
  Pool pool = 2;
}

// Define (or redefine) the domain for a VM. `spec_json` is an
// `mst_core::vm::VmSpec`; shared Rust types avoid duplicating the schema here.
message DefineVm {
  string vm_id = 1;
  string tenant_id = 2;
  string name = 3;
  uint64 generation = 4;
  string spec_json = 5;
  // Pools the VM's disks live in.
  repeated Pool pools = 6;
  // Limits for each of its disks (its cluster's).
  DiskLimits disk_limits = 7;
}

// Throttling for a disk; 0: none.
message DiskLimits {
  uint64 iops = 1;
  uint64 bytes_per_sec = 2;
}

// Changes the limits of a VM's disks, live and in its definition.
message SetDiskLimits {
  string vm_id = 1;
  // Disk targets (vda, ...).
  repeated string targets = 2;
  DiskLimits limits = 3;
}

message StartVm {
  string vm_id = 1;
  // Make its UEFI variables afresh from their template first (after Secure
  // Boot was turned on or off: the template holds the keys, or none).
  bool reset_nvram = 2;
}

message StopVm {
  string vm_id = 1;
  // Pull the plug instead of an ACPI shutdown.
  bool force = 2;
}

message RebootVm {
  string vm_id = 1;
}

// Destroy and undefine the domain and remove its per-VM files. Volumes are
// deleted separately.
message UndefineVm {
  string vm_id = 1;
}

// The CPU model all of `cpus_json` (each an `mst_core::vm::CpuSpec`) can run,
// keeping only features that survive migration. Returns a CpuSpec.
message BaselineCpu {
  repeated string cpus_json = 1;
  // Every feature of the result listed (the model's own too), to compare
  // CPUs by: the answer then says "expanded": true.
  bool expand = 2;
}

// On a migration's destination: set up what the VM needs besides its
// volumes (storage pools, Ceph secrets, the cloud-init seed), without
// defining the domain; the migration brings that.
message PrepareMigration {
  DefineVm vm = 1;
}

// On a migration's source: live-migrate the running VM to the host at
// `dest_address`. Returns when done (or failed, the VM still running here).
// One step of a live migration the controller drives: libvirt's Begin
// (source), Prepare (destination), Perform (source), Finish (destination)
// and Confirm (source), each on that host's own libvirt, the controller
// carrying the cookies from one to the next. Hosts' libvirt daemons never
// talk to each other. Returns {"cookie": base64, "xml"?, "uri"?} as JSON.
message MigrationStep {
  enum Step {
    BEGIN = 0;
    PREPARE = 1;
    PERFORM = 2;
    FINISH = 3;
    CONFIRM = 4;
  }
  string vm_id = 1;
  Step step = 2;
  // Describe the migration alike at every step.
  string dest_address = 3;
  repeated string copy_disks = 4;
  // From the previous step.
  bytes cookie = 5;
  // Prepare: the domain XML Begin returned.
  string xml = 6;
  // Perform and Finish: the URI Prepare returned.
  string uri = 7;
  // Finish: the domain's name.
  string name = 8;
  // Finish and Confirm: undo instead.
  bool cancelled = 9;
  // Prepare (the destination's server certificate) and Perform (the
  // source's client certificate): this migration's own TLS credentials,
  // from a CA made for it alone. QEMU on each side trusts only that CA for
  // it, so only the source can send the VM in.
  MigrationTls tls = 10;
  // 11: whether local disks were copied whole, before they always were.
  reserved 11;
}

message MigrationTls {
  string ca_pem = 1;
  string cert_pem = 2;
  string key_pem = 3;
}

// A storage pool was deleted: let go of it on this host (unmount, keyring,
// libvirt secret) and, if asked, remove metastratum's data from its storage
// (only one host is asked, and only when no other pool uses that storage).
message RemovePool {
  Pool pool = 1;
  bool remove_data = 2;
}

// Back up a VM's disks into a repository (an NFS pool the host mounts), as
// `backups/<backup_id>/<index>.qcow2`. A running VM is backed up live with
// libvirt's backup job, its file systems frozen for the start when its guest
// agent answers; a stopped one by copying its volumes. Asked again, it waits
// for a backup in progress, and answers for one already taken.
//
// With a parent, a disk the parent has (`parent_index`) may be stored as
// what changed since: a qcow2 file backed by the parent's copy
// (`../<parent_id>/<parent_index>.qcow2`). A running VM's changes come from
// the dirty bitmaps of its libvirt checkpoint (`mst-<backup id>`, one per
// backup taken live, the latest kept); a stopped VM's by comparing its
// volumes with the parent's copies. Ceph disks are copied in full.
//
// Returns JSON {"stored_bytes": n, "consistent": bool, "incremental": bool,
// "full_reason": "..."}: whether any disk was stored as changes, and if
// none was although a parent was given, why.
message BackupVm {
  string vm_id = 1;
  string backup_id = 2;
  Pool repository = 3;
  repeated BackupDisk disks = 4;
  // The backup this one may build on (in the same repository); empty for a
  // full backup.
  string parent_id = 5;
  // Backups of the VM taken up to the parent (the parent included), newest
  // first: a checkpoint of any of them has tracked the changes since the
  // parent was taken.
  repeated string checkpoints = 6;
}

message BackupDisk {
  // Its place among the VM's disks: vda is 0.
  uint32 index = 1;
  string volume_id = 2;
  Pool pool = 3;
  // Its target device in the VM's domain (vda, sdb...); empty only for a
  // disk of no running VM (one kept as its VM is deleted, say).
  string target = 4;
  // Its place in the parent backup, when the parent has it.
  optional uint32 parent_index = 5;
}

// Create a volume from one of a backup's disks. An existing volume is left
// alone.
message RestoreVolume {
  string volume_id = 1;
  uint64 size_bytes = 2;
  Pool pool = 3;
  Pool repository = 4;
  string backup_id = 5;
  uint32 index = 6;
}

// Remove a backup's files from its repository. Backups built on it
// (`children`) first take in what they need of it: each of their files
// backed by one of its is merged with it (committed into it, which then
// takes the child file's place). Returns JSON {"children": {"<id>": bytes}}:
// what each child takes up afterwards.
message DeleteBackup {
  Pool repository = 1;
  string backup_id = 2;
  repeated string children = 3;
}

// Take a snapshot of a VM's disks, all at the same moment, in the disks
// themselves; with its guest's file systems frozen if its agent answers.
// Answers {"consistent": bool}. Taking one that exists answers as well.
message SnapshotVm {
  string vm_id = 1;
  string snapshot_id = 2;
  repeated BackupDisk disks = 3;
}

// Put a stopped VM's disks back as they were in a snapshot. Their change
// tracking for incremental backups (dirty bitmaps, and the VM's libvirt
// checkpoints) goes first: it would not account for the revert, and QEMU
// refuses to revert disks that have it.
message RevertSnapshot {
  string vm_id = 1;
  string snapshot_id = 2;
  repeated BackupDisk disks = 3;
}

// Remove a snapshot from a VM's disks; one already gone is fine.
message DeleteSnapshot {
  string vm_id = 1;
  string snapshot_id = 2;
  repeated BackupDisk disks = 3;
}

// Grow one of a VM's disks to `size_bytes`: through libvirt while the VM
// runs (the guest sees the new size at once), otherwise the volume itself.
// A disk already that large is left alone.
message ResizeDisk {
  string vm_id = 1;
  BackupDisk disk = 2;
  uint64 size_bytes = 3;
}

// Create a volume as a copy of another in the same pool, at least
// `size_bytes` large, on the image it was made from if given (file pools
// keep sharing it). No VM may be using the source. An existing volume is
// left alone.
message CloneVolume {
  Pool pool = 1;
  string source_volume_id = 2;
  string volume_id = 3;
  uint64 size_bytes = 4;
  // 5: an image the copy kept sharing, before the image store.
  reserved 5;
}

// Give a running VM this much memory, through its balloon (its definition
// is updated with DefineVm).
message SetMemory {
  string vm_id = 1;
  uint64 memory_mib = 2;
}

// Plug virtual CPUs into a running VM, or out of it, until it has this many
// (its definition is updated with DefineVm).
message SetVcpus {
  string vm_id = 1;
  uint32 vcpus = 2;
}

// What a running VM's balloon reports about its memory. Answers with JSON:
// actual_mib, driver, available_mib, usable_mib, unused_mib, rss_mib.
message MemoryStats {
  string vm_id = 1;
}

// An image was deleted: remove its copies from this host's image store, and
// from those of `pools` (shared pools this host reaches). Every pool is
// tried; the error names those that failed.
message DeleteImage {
  string image_id = 1;
  repeated Pool pools = 2;
  string tenant_path = 3;
}

// The host is being decommissioned and wiped: remove metastratum from it. Lets
// go of pools; removes cached images, local volumes, seeds, metastratum's TLS
// files and libvirt secrets; puts back the OVN southbound settings metastratum
// changed (OVN itself is the admin's and stays); then the agent's identity
// and service. Returns a report (JSON).
message Decommission {}

// Progress of the VM's migration job. Returns mst_libvirt::JobStats as JSON.
message MigrationStats {
  string vm_id = 1;
}

message AbortMigration {
  string vm_id = 1;
}

// Whether the VM's domain is here and in what state. Returns
// {"defined": bool, "power": "...", "job_active": bool}.
message DomainInfo {
  string vm_id = 1;
}

// Renew the host certificate now (normally the agent does so on its own
// before it expires).
message RenewCertificate {}

enum ConsoleKind {
  CONSOLE_KIND_UNSPECIFIED = 0;
  CONSOLE_KIND_VNC = 1;
  CONSOLE_KIND_SERIAL = 2;
}

message OpenConsole {
  string session_id = 1;
  string vm_id = 2;
  ConsoleKind kind = 3;
}

message TunnelChunk {
  oneof msg {
    string session_id = 1;
    bytes data = 2;
  }
}

// Plug the disk at `target` into the running VM, as `vm` (its definition
// with the disk) has it, and define it so. A VM not running is only
// defined.
message AttachDisk {
  DefineVm vm = 1;
  string target = 2;
  // The disk's volume, to tell it from another disk at `target`.
  string volume_id = 3;
}

// Plug the interface with `mac` into the running VM, as `vm` (its
// definition with the interface) has it, and define it so. A VM not running
// is only defined.
message AttachNic {
  DefineVm vm = 1;
  string mac = 2;
}

// Unplug the interface with `mac` from the running VM, waiting until the
// guest lets go of it, and define `vm` (its definition without it). A VM not
// running is only defined.
message DetachNic {
  DefineVm vm = 1;
  string mac = 2;
}

// Unplug the running VM's interface with `mac` and plug it in again: the
// guest sets it up afresh, asking DHCP for its address (after it moved to
// another network; a link only taken down and up, guests keep their lease).
// `vm` is the VM's definition. A VM not running is left alone.
message ReplugNic {
  DefineVm vm = 1;
  string mac = 2;
}

// Unplug the disk at `target` from the running VM, waiting until the guest
// lets go of it, and define `vm` (its definition without the disk). A VM
// not running is only defined.
message DetachDisk {
  DefineVm vm = 1;
  string target = 2;
  // The disk's volume, to tell it from another disk at `target`.
  string volume_id = 3;
}

// Serve a volume, read-only, to one other host over NBD with TLS, for it to
// copy (CopyVolume): `tls` holds this copy's server credentials, which only
// that host's client certificate matches. Returns {"port": N} once it
// listens on `address` (this host's); it stops when that host disconnects,
// with EndExport, or after an hour. Volumes in pools of files only.
message ExportVolume {
  string volume_id = 1;
  Pool pool = 2;
  MigrationTls tls = 3;
  string address = 4;
}

// Stop serving a volume (ExportVolume), or an image (ExportImage, by its
// `export_id`), if it still is.
message EndExport {
  string volume_id = 1;
}

// Create a volume in `pool` as a copy of another (with its image's data:
// the copy depends on nothing), of at least `size_bytes`: from a pool this
// host reaches (`source_pool`), or served by another host (`nbd_*`, with
// this copy's client credentials in `tls`). An existing volume is left
// alone.
message CopyVolume {
  string volume_id = 1;
  uint64 size_bytes = 2;
  Pool pool = 3;
  Pool source_pool = 4;
  string nbd_address = 5;
  uint32 nbd_port = 6;
  MigrationTls tls = 7;
}

// Download an image into an image store: this host's (the local pool's
// images/<tenant path>/<image id>.qcow2, converted to qcow2), or with `pool`
// that pool's (the same in a pool of files; on Ceph a raw RBD image,
// store_<tenant path, '_' for '/'>_<image id>). `tenant_path` is the owning
// tenant's lineage (tenant IDs in simple hex form, root first, separated by
// '/'). Tenants' images come from public addresses only, and
// describe disks of at most the host's largest download (`image_max_gib`).
// With `digest`, the disk must hold that (an image downloaded again). An
// image already in the store is kept, never replaced. Returns {"size_bytes":
// N, "virtual_bytes": N, "sha256": "...", "digest": "..."}: the SHA-256 of
// the file downloaded, and of the disk it holds (its contents as a raw
// disk), which copies are checked against.
// Add an image this host received (ReceiveImage: uploaded, or downloaded
// by the controller) to its store, or `pool`'s: checked (it refers to no
// other files, and its disk is no larger than allowed, more for `trusted`
// images, the provider's) and converted to qcow2, and the file received
// then goes. An image in the store already is kept. Returns
// {"size_bytes", "virtual_bytes", "sha256", "digest"}.
message StoreImage {
  string image_id = 1;
  string tenant_path = 2;
  // "qcow2" or "raw": the format of the file received.
  string format = 3;
  bool trusted = 4;
  Pool pool = 5;
}

// A part of an image coming to this host (uploaded, or downloaded by the
// controller), written at `offset` into the file kept for it; `total` is
// the whole file's size, or 0 when not known. A part at offset 0 starts it
// over. A part beyond what is here is not written. Returns
// {"received": N}: how much of it is here.
message ReceiveImage {
  string image_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  uint64 total = 4;
}

// Serve an image in this host's store to one other host, as ExportVolume
// serves a volume, for it to copy (CopyImage). `export_id` names this
// serving (EndExport ends it). Returns {"port": N}.
message ExportImage {
  string image_id = 1;
  string tenant_path = 2;
  MigrationTls tls = 3;
  string address = 4;
  string export_id = 5;
}

// Copy an image into this host's store from another host serving it
// (ExportImage), or with `source_pool` from that pool's store. The copy must
// hold `digest` (the image's, of its disk read as raw), or it is thrown
// away. One already in the store is kept. Returns as StoreImage.
message CopyImage {
  string image_id = 1;
  string tenant_path = 2;
  string nbd_address = 3;
  uint32 nbd_port = 4;
  MigrationTls tls = 5;
  string export_id = 6;
  Pool source_pool = 7;
  string digest = 8;
}

// Create a volume as a copy of an image in this host's store (or with
// `source_pool`, that pool's), of at least `size_bytes`: the volume depends
// on nothing. An existing volume is left alone.
message VolumeFromImage {
  string volume_id = 1;
  uint64 size_bytes = 2;
  Pool pool = 3;
  string image_id = 4;
  string tenant_path = 5;
  Pool source_pool = 6;
}

// Remove from an image store (this host's, or with `pool` that shared
// pool's) the images not among `image_ids` that are an hour old or more,
// and downloads or copies cut off a day ago or more. Returns {"removed":
// [image ids]}.
// The VM's TPM state on this host. Returns {"digest": SHA-256 (hex) of the
// state, "state": the state (base64)}, without "state" when its digest is
// `known` (nothing changed), and {} when the VM has no TPM state here.
message ExportTpm {
  string vm_id = 1;
  string known = 2;
}

// Put a VM's TPM state in place here (it starts here next, having run
// elsewhere), in place of any it had here. `digest` is SHA-256 (hex) of
// `state`, checked. Neither: what it had here goes (its TPM was removed).
message ImportTpm {
  string vm_id = 1;
  bytes state = 2;
  string digest = 3;
}

// Whether a file exists in the VM's guest, asked through its guest agent.
// Returns "true" or "false"; fails while the guest agent does not answer.
message GuestFileExists {
  string vm_id = 1;
  string path = 2;
}

message PruneStore {
  Pool pool = 1;
  repeated string image_ids = 2;
  // When image_ids was listed (Unix seconds): images stored since may be
  // missing from it, and stay.
  uint64 listed_at = 3;
}
